name: actualizar-y-publicar
on:
  schedule: [{cron: "30 5 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lastfm-campeonato
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install openpyxl tzdata
      - name: Descargar escuchas nuevas de Last.fm
        run: python sync.py
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: Daniel_877
      - name: Guardar la base de datos
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add campeonato.db && (git commit -m "datos $(date -u +%F)" && git push) || echo "sin cambios"
      - name: Generar la web
        run: |
          python web/build_data.py
          python web/build_web.py
          mkdir -p publico && cp web/index.html publico/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: lastfm-campeonato/publico}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
